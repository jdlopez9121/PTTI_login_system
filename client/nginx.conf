server {
    listen 80;
    client_max_body_size 20M;

    # Re-resolve upstream DNS on each request so Railway container IP
    # changes after a backend redeploy don't leave Nginx with a stale cache.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy all /api requests to the Express server
    location /api/ {
        set $upstream http://${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
